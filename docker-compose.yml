services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abstract0-backend
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_AGENT_ID=${MISTRAL_AGENT_ID}
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/.venv
    networks:
      - abstract0-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: abstract0-frontend
    ports:
      - "8080:8080"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - abstract0-network
    restart: unless-stopped

networks:
  abstract0-network:
    driver: bridge
